<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="profile-card">

        <h1 id="profileHeading">My Profile</h1>

        <img 
            id="profileImage"
            src="https://i.pravatar.cc/250?img=12"
            onmouseover="imageOver()"
            onmouseout="imageOut()"
        >

        <h2 id="profileName">Muhammad Umer</h2>

        <h3 id="profileRole">Frontend Developer</h3>

        <p id="profileDescription">
            I am a passionate developer who loves creating websites
            and learning new technologies.
        </p>

        <div class="buttons">

            <button onclick="changeProfile()">
                Change Profile
            </button>

            <button onclick="changeImage()">
                Change Image
            </button>

        </div>

        <div class="user-section">

            <input 
                type="text" 
                id="userName"
                placeholder="Enter your name"
            >

            <button onclick="showName()">
                Show My Name
            </button>

        </div>

        <p id="welcomeMessage"></p>

        <button class="bonus-btn" onclick="changeDescription()">
            Bonus Feature
        </button>

    </div>

    <script src="app.js"></script>

</body>
</html>
